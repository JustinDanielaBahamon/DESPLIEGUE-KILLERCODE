# ============================================
# Perfil "docker": usado cuando el backend corre dentro de un contenedor.
# Los valores se inyectan mediante variables de entorno definidas en
# docker-compose.yml (que a su vez toma los valores desde .env).
# ============================================
spring.datasource.url=jdbc:mysql://${SPRING_DATASOURCE_HOST}:${SPRING_DATASOURCE_PORT}/${SPRING_DATASOURCE_DB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
