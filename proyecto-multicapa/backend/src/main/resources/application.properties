# ============================================
# Configuración base (perfil por defecto / local sin Docker)
# ============================================
spring.application.name=multicapa-backend
server.port=8080

# Datasource local por defecto (ajustar si se ejecuta sin Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/multicapa_db
spring.datasource.username=multicapa_user
spring.datasource.password=change_me
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
